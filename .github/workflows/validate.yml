name: Validate

# Every change must keep the locales consistent with English and come with
# an updated manifest.json, or the app won't pick it up. app-config.json
# must be valid too: a mistake there could lock people out of the app.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Locales match English
        run: node scripts/validate.mjs
      - name: Manifest is up to date
        run: node scripts/build-manifest.mjs --check
      - name: App config is valid
        run: node scripts/validate-config.mjs
      - name: Stories are valid
        run: node scripts/validate-stories.mjs
